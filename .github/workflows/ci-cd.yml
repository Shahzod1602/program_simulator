name: Test and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campus-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Install gVisor on the ephemeral GitHub runner
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main' | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -qq
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl reload docker
      - name: Build sandbox runtime
        run: docker build -t campus-sandbox:ci sandbox
      - name: Test accounts, curriculum and real isolated code execution
        env:
          RUN_SANDBOX_TESTS: '1'
          SANDBOX_IMAGE: campus-sandbox:ci
        run: python -m unittest discover -s tests -v
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Upload tested source through restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/campus_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/campus_key' EXIT
          git archive --format=tar HEAD public sandbox scripts tests server.py sandbox_runner.py manage.py reap_sandboxes.py requirements.txt requirements.lock README.md deploy > /tmp/campus-release.tar
          ssh -i ~/.ssh/campus_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 campus-deploy@167.233.140.202 < /tmp/campus-release.tar
      - name: Verify public HTTPS endpoint
        run: curl --fail --retry 5 --retry-delay 2 https://autplatform.uz/api/health
