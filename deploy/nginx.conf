server {
    listen 80;
    listen [::]:80;
    server_name autplatform.uz www.autplatform.uz 167.233.140.202;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/campus-acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://autplatform.uz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.autplatform.uz;
    ssl_certificate /etc/letsencrypt/live/autplatform.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autplatform.uz/privkey.pem;
    return 308 https://autplatform.uz$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 167.233.140.202;
    ssl_certificate /etc/letsencrypt/live/campus-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus-ip/privkey.pem;
    return 308 https://autplatform.uz$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name autplatform.uz;
    ssl_certificate /etc/letsencrypt/live/autplatform.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autplatform.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
